:<\/b> Track","<br><b>Date:<\/b> 2016-06-16<br><b>Type:<\/b> Genetics<br><b>Description:<\/b> Genetic testing of a new hair sample provided the proof: M29 was back.","<br><b>Date:<\/b> 2016-06-21<br><b>Type:<\/b> Track","<br><b>Date:<\/b> 2016-06-23<br><b>Type:<\/b> Track","<br><b>Date:<\/b> 2016-07-02<br><b>Type:<\/b> Scat","<br><b>Date:<\/b> 2016-10-29<br><b>Type:<\/b> Track","<br><b>Date:<\/b> 2016-10-31<br><b>Type:<\/b> several unverifiable indications<br><b>Description:<\/b> Before hibernation: Where exactly he spent the winter is unknown.","<br><b>Date:<\/b> 2017-03-26<br><b>Type:<\/b> Track<br><b>Description:<\/b> M29 had awakened from his hibernation.","<br><b>Date:<\/b> 2017-04-17<br><b>Type:<\/b> Picture<br><b>Description:<\/b> M29 was captured by a camera trap.","<br><b>Date:<\/b> 2017-04-17<br><b>Type:<\/b> Damage to beehouse<br><b>Description:<\/b> M29 helped himself to some honey from an apiary.","<br><b>Date:<\/b> 2017-04-22<br><b>Type:<\/b> Picture<br><b>Description:<\/b> The bear was detected using a camera trap image.","<br><b>Date:<\/b> 2017-05-07<br><b>Type:<\/b> Genetics<br><b>Description:<\/b> M29 has been genetically detected.","<br><b>Date:<\/b> 2017-05-09<br><b>Type:<\/b> Track<br><b>Description:<\/b> Fresh and clearly visible bear tracks in the snow confirmed it: he had been here!","<br><b>Date:<\/b> 2017-05-23<br><b>Type:<\/b> Track<br><b>Description:<\/b> A gamekeeper found traces of a bear. The different prints of the front and hind paws were clearly visible.","<br><b>Date:<\/b> 2017-05-26<br><b>Type:<\/b> Picture<br><b>Description:<\/b> The canton of Bern had its emblematic animal back: a farmer observed and photographed M29.","<br><b>Date:<\/b> 2017-05-28<br><b>Type:<\/b> Picture","<br><b>Date:<\/b> 2017-06-28<br><b>Type:<\/b> Track","<br><b>Date:<\/b> 2017-06-30<br><b>Type:<\/b> Sighting<br><b>Description:<\/b> A mountaineer spotted M29 on the glacier of the Sustenhorn.","<br><b>Date:<\/b> 2017-09-01<br><b>Type:<\/b> Sighting<br><b>De pe:<\/b> Scat<br><b>Description:<\/b> A hiker found brown bear feces","<br><b>Date:<\/b> 2018-06-02<br><b>Type:<\/b> Picture<br><b>Description:<\/b> The bear was once again captured on a camera trap.","<br><b>Date:<\/b> 2018-06-19<br><b>Type:<\/b> Picture<br><b>Description:<\/b> From the air: Paraglider pilot spotted M29 on the Fiescherhorn glacier (Canton of Valais).","<br><b>Date:<\/b> 2018-07-08<br><b>Type:<\/b> Track","<br><b>Date:<\/b> 2018-07-08<br><b>Type:<\/b> Track","<br><b>Date:<\/b> 2018-08-03<br><b>Type:<\/b> Sighting<br><b>Description:<\/b> M29 was observed from an Air Zermatt helicopter.","<br><b>Date:<\/b> 2018-08-06<br><b>Type:<\/b> Sighting","<br><b>Date:<\/b> 2018-08-15<br><b>Type:<\/b> Picture<br><b>Description:<\/b> In Uri, the bear was once again recorded on a camera trap.","<br><b>Date:<\/b> 2018-11-03<br><b>Type:<\/b> Track<br><b>Description:<\/b> Back in the canton of Uri: hikers reported fresh bear tracks. The responsible gamekeeper confirmed this.","<br><b>Date:<\/b> 2019-04-19<br><b>Type:<\/b> Track<br><b>Description:<\/b> Hibernation over: M29 left fresh tracks in the snow.","<br><b>Date:<\/b> 2019-04-24<br><b>Type:<\/b> Track","<br><b>Date:<\/b> 2019-04-29<br><b>Type:<\/b> Track","<br><b>Date:<\/b> 2019-04-30<br><b>Type:<\/b> Track<br><b>Description:<\/b> The bear had already run through practically the same spot the year before.","<br><b>Date:<\/b> 2019-05-01<br><b>Type:<\/b> Track","<br><b>Date:<\/b> 2019-05-07<br><b>Type:<\/b> Track<br><b>Description:<\/b> A gamekeeper was able to follow the bear's trail for several hundred meters. During its wanderings, M29 rummaged through two anthills.","<br><b>Date:<\/b> 2019-05-21<br><b>Type:<\/b> Genetics<br><b>Description:<\/b> A genetic sample once again confirmed M29’s presence in the canton of Bern.","<br><b>Date:<\/b> 2019-06-04<br><b>Type:<\/b> Video<br><b>Description:<\/b> M29 was filmed and photographed between Riederalp and Bettmeralp.","<br><b>Date:<\/b> 2019-06-08<br><b>Type:<\/b> Genetics<br><b>Description:<\/b> Once again, a genetic analysis of a fecal sample confirmed the presence of a bear.","<br><b>Date:<\/b> 2019-06-22<br><b>Type:<\/b> Video<br><b>Description:<\/b> A driver on their way home observed M29 on a road, until he disappeared into the forest.","<br><b>Date:<\/b> 2019-06-23<br><b>Type:<\/b> Track<br><b>Description:<\/b> The last traces on Swiss soil were documented over a length of 50 meters.","<br><b>Date:<\/b> 2019-06-28<br><b>Type:<\/b> Genetics<br><b>Description:<\/b> Back in Italy: only a few days after the last traces in Switzerland, M29 was confirmed from a blood trail. Since then, he has been living west of Lake Maggiore on the Italian side."],null,null,{"interactive":false,"permanent":false,"direction":"auto","opacity":1,"offset":[0,0],"textsize":"10px","textOnly":false,"className":"","sticky":true},null]},{"method":"addEasyButton","args":[{"icon":"fa-globe","title":"Reset Zoom","onClick":"function(btn, map){ \n                   map.setView([\n46.7035048812957\n, \n8.44808888770568\n], 9.3);\n                }","position":"topleft"}]},{"method":"addScaleBar","args":[{"maxWidth":100,"metric":true,"imperial":false,"updateWhenIdle":true,"position":"bottomleft"}]},{"method":"addLegend","args":[{"colors":["#FDD262","#C7B19C","#446455","#E8D79F"],"labels":["2016","2017","2018","2019"],"na_color":null,"na_label":"NA","opacity":1,"position":"topright","type":"factor","title":"Year","extra":null,"layerId":null,"className":"info legend","group":null}]},{"method":"addCircleMarkers","args":[46.76668019155778,8.452574068998699,5,null,null,{"interactive":true,"className":"","stroke":true,"color":"black","weight":1,"opacity":1,"fill":true,"fillColor":"#446455","fillOpacity":1},null,null,"<br><b>Date:<\/b> 2018-04-08<br><b>Type:<\/b> Picture<br><b>Description:<\/b> The next canton: M29 was detected for the first time in the canton of Obwalden.<br><img src='data/Alain.jpg' width='200' style='display:block; margin:5px 0;'><div style='font
